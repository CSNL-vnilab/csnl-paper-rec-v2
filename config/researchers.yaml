# csnl-paper-rec researcher registry — delivery single source of truth.
# Channel IDs = INIT_claude per-researcher channels (2026-05-13 routing
# directive: researcher-facing messages go to these channels, NOT DM;
# a short DM ping additionally points to the channel post).
#
# SYJ + BHL are ONE recommendation unit: two juniors co-working JSL's
# follow-up research. Topic extraction merges their projects; the
# resulting recommendation is delivered to BOTH members' channels + DM
# pings. (Operator may override at dry-run.)

units:
  - unit_id: JOP
    members: [JOP]
  - unit_id: BYL
    members: [BYL]
  - unit_id: MSY
    members: [MSY]
  - unit_id: SMJ
    members: [SMJ]
  - unit_id: JYK
    members: [JYK]
  - unit_id: "SYJ+BHL"
    members: [SYJ, BHL]
    note: "JSL 후속 공동연구 — 한 추천 단위, 두 채널/DM 전달"

